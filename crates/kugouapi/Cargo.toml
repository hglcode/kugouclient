[package]
name = "kugouapi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Unofficial KuGou music API client for Rust. Full endpoint catalog (271), built-in session management, complete protocol coverage (android/web signatures, session cipher, login family, cloudlist, KRC lyrics)."

[lib]
name = "kugouapi"
path = "src/lib.rs"

[features]
default = ["reqwest-transport"]
# Default HTTP transport backed by reqwest + rustls. Disable to bring your own
# implementation of the `Transport` trait (e.g. in tests or embedded runtimes).
reqwest-transport = ["dep:reqwest"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true, optional = true }
thiserror = { workspace = true }
md-5 = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
rsa = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
flate2 = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
httpdate = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
