[workspace]
resolver = "2"
members = ["crates/kugouapi", "crates/kugouapi-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV floor raised by the 2025 crypto stack: aes 0.9 requires 1.89,
# sha2 0.11 requires 1.88.
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/hglcode/kugouapi-rs"
keywords = ["kugou", "music", "api-client", "async"]
categories = ["api-bindings", "multimedia::audio"]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
# reqwest 0.13 reorganized features: `rustls-tls` -> `rustls`, and
# `RequestBuilder::query()` is now gated behind the `query` feature.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "query"] }
thiserror = "2.0.21"
md-5 = "0.11.0"
sha2 = "0.11.1"
sha1 = "0.11.0"
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
# `getrandom` enables `rsa::rand_core::OsRng`: rsa 0.9 bounds its RNG
# parameters on rand_core 0.6 traits while this crate uses rand 0.10
# (rand_core 0.10), so RSA calls take rsa's own re-exported OS RNG.
rsa = { version = "0.9.10", features = ["sha2", "getrandom"] }
base64 = "0.23.1"
hex = "0.4.3"
flate2 = "1.1.10"
rand = "0.10.3"
uuid = { version = "1.29.0", features = ["v4"] }
tracing = "0.1.44"
futures = "0.3.34"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
dirs = "7.0.0"
httpdate = "1.0.3"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# Protocol field names keep the reference (JS) wire spelling.
non_snake_case = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# The protocol layer deliberately mirrors the reference implementation's JS
# number coercion (Number() / String()), so narrowing casts and big literals
# are part of the contract rather than accidents.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
unreadable_literal = "allow"
# Endpoint handlers take loose typed params by value for builder ergonomics.
needless_pass_by_value = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
# Wire field names (imgFile / thumbUrl) intentionally keep the reference names.
struct_excessive_bools = "allow"
option_option = "allow"
items_after_statements = "allow"
